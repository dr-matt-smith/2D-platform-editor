<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Platform Editor</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d20; --card: #ffffff; --muted: #5d5d66; --accent: #2f6fdb; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1d1d20; --fg: #ececf0; --card: #2a2a2f; --muted: #a3a3ad; --accent: #7aa7ff; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
             font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 640px; width: 100%; }
      h1 { margin: 0 0 4px; font-size: 1.6rem; }
      p.lead { margin: 0 0 24px; color: var(--muted); }
      .apps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      a.app { display: block; padding: 16px 18px; border-radius: 10px; background: var(--card); color: inherit;
              text-decoration: none; border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); }
      a.app:hover { border-color: var(--accent); }
      a.app strong { display: block; color: var(--accent); font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>2D Platform Editor</h1>
      <p class="lead">Design ASCII platformer levels, then play them.</p>
      <div class="apps">
        <a class="app" href="./apps/editor/"><strong>Editor</strong>Write levels as text with a live tile preview, playtest them, and let the agent check they can be solved.</a>
        <a class="app" href="./apps/player/"><strong>Player</strong>Pick a level and play it full-window.</a>
      </div>
    </main>
  </body>
</html>
