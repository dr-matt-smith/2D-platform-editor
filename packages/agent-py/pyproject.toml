[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-py"
version = "0.0.0"
description = "Pure-Python port of the 2D level-designer's planning agent: agent_adapter (physics engine, {TILE, make_scene, make_scripted_input} contract) + agent_planner (A* solver that emits a solving input recording). Parity-tested against the JS code."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
mcp = ["mcp>=1.2"]

[project.scripts]
agent-py-mcp = "agent_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
